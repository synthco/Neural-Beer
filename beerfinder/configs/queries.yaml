instagram: #Check if a #needed
  hashtags:
    lager: ["#lager", "#pilsner", "#ontap", "#craftbeer", "#beerphotography"]
    wheat: ["#wheatbeer", "#hefeweizen", "#witbier", "#weizenglas", "#weissbier"]
    ipa: ["#ipa", "#westcoastipa", "#neipa", "#dipA", "#hophead"]
    stout: ["#stout", "#imperialstout", "#nitrostout", "#oatmealstout", "#darkbeer"]
    porter: ["#porter", "#robustporter", "#balticporter", "#brownporter", "#darkale"]
    sour: ["#sourbeer", "#fruitedsour", "#berlinerweisse", "#wildale", "#teku"]

  places_keywords:
    - "taproom"
    - "craft brewery"
    - "beer bar"
    - "brewpub"
    - "taphouse"
    - "beer garden"
    - "pub"

  instaloader_examples:
    by_hashtag:
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :HASHTAG:neipa"
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :HASHTAG:stout"
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :HASHTAG:lager"
    by_place:
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :PLACE:\"taproom\""
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :PLACE:\"craft brewery\""
      - "instaloader --no-videos --fast-update --dirname-pattern=\"{target}\" :PLACE:\"beer bar\""
